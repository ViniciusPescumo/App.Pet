<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Pet - Admin</title>
</head>

<body>
    <h2>Cadastrar Pet</h2>
    <input id="nome_pet" placeholder="Nome do Pet">
    <input id="especie" placeholder="Especie">
    <input id="raca" placeholder="Raça">
    <input id="bloco" placeholder="Bloco">
    <input id="apartamento" placeholder="Apartamento">
    <input id="nome_tutor" placeholder="Nome do tutor">
    <input id="telefone_tutor" placeholder="Telefone tutor">
    <button onclick="cadastrar()">Cadastrar</button>

    <h2>Buscar por Apto</h2>
    <input id="busca" placeholder="Nº apto">
    <button onclick="buscar()">Buscar</button>
    <ul id="lista"></ul>

    <script>
        const API = "http://127.0.0.1:8000" /* TESTE  */

        async function cadastrar() {
            const res = await fetch(API + "/pets", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    nome_pet: document.getElementById('nome_pet').value,
                    especie: document.getElementById('especie').value,
                    raca: document.getElementById('raca').value,
                    bloco: document.getElementById('bloco').value,
                    apartamento: document.getElementById('apartamento').value,
                    nome_tutor: document.getElementById('nome_tutor').value,
                    telefone_tutor: document.getElementById('telefone_tutor').value
                })
            });

            alert(res.ok ? "Cadastrado!" : "Erro: " + await res.text());

        }

        async function buscar() {
            const apto = document.getElementById('busca').value;
            const res = await fetch(API + "/apartamento/" + apto);
            const pets = await res.json();
            document.getElementById('lista').innerHTML = pets.map(p =>
                `<li><b>${p.nome_pet}</b> (${p.especie} - ${p.raca}) | Bloco ${p.bloco} Apto ${p.apartamento}
                    | Tutor: ${nome_tutor} - ${p, telefone_tutor}</li>`
            ).join('');
        }


    </script>


</body>

</html>

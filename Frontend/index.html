<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Pet - Admin</title>
    <link rel="stylesheet" href="src/index.css">
</head>

<body>
    <div class="card">
        <h2>Cadastrar Pet</h2>
        <div class="grid">
            <input id="nome_pet" placeholder="Nome do Pet">
            <input id="especie" placeholder="Especie">
            <input id="raca" placeholder="Raça">
            <input id="bloco" placeholder="Bloco">
            <input id="apartamento" placeholder="Apartamento">
            <input id="nome_tutor" placeholder="Nome do tutor">
            <input id="telefone_tutor" placeholder="Telefone tutor">
            <button id="btn-cadastrar" type="button" onclick="cadastrar()">Cadastrar</button>
        </div>
    </div>

    <div class="card">
        <h2>Buscar por Apto</h2>
        <div class="busca">
            <input id="busca" placeholder="Nº apto">
            <button type="button" onclick="buscar()">Buscar</button>
            <ul id="lista"></ul>
        </div>
    </div>
    <script>

        let id_editado = null

        const API = "http://127.0.0.1:8000" /* TESTE  */

        async function cadastrar() {
            const btn = document.getElementById('btn-cadastrar'); // coloca id="btn-cadastrar" no botão
            btn.disabled = true;
            btn.innerText = "Salvando...";

            const res = await fetch(API + "/pets", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    nome_pet: document.getElementById('nome_pet').value,
                    especie: document.getElementById('especie').value,
                    raca: document.getElementById('raca').value,
                    bloco: document.getElementById('bloco').value,
                    apartamento: document.getElementById('apartamento').value,
                    nome_tutor: document.getElementById('nome_tutor').value,
                    telefone_tutor: document.getElementById('telefone_tutor').value
                })
            });

            alert(res.ok ? "Cadastrado!" : "Erro: " + await res.text());

            btn.disabled = false;
            btn.innerText = "Cadastrar";
        }

        async function buscar() {
            const apto = document.getElementById('busca').value;
            const res = await fetch(API + "/apartamento/" + apto);
            const pets = await res.json();
            document.getElementById('lista').innerHTML = pets.map(p =>
                `<li><b>${p.nome_pet}</b> (${p.especie} - ${p.raca}) | Bloco ${p.bloco} Apto ${p.apartamento} | Tutor: ${p.nome_tutor} - ${p.telefone_tutor}
                    <button onclieck="editar(${JSON.stringify(p)})">Editar</button>
                    <button onclick="apagar(${p.id})">Apagar</button> </li>`
            ).join('');
        }
        
            async function apagar(id){
                if(!confirm("Tem certeza que quer apagar esse pet?")) return;
                await fetch(API+ "/pets/" + id, {method: "DELETE"});
                buscar()
            }

        function editar(){
            document.getElementById('nome_pet').value = pet.nome_pet;
            document.getElementById('nome_pet').value = pet.especie;
            document.getElementById('nome_pet').value = pet.raca;
            document.getElementById('nome_pet').value = pet.bloco;
            document.getElementById('nome_pet').value = pet.apartamento;
            document.getElementById('nome_pet').value = pet.nome_tutor;
            document.getElementById('nome_pet').value = pet.telefone_tutor;
            id_editado = pet.id;
            document.getElementById("cadastrar").innerText = "Atualizar";
        }


    </script>


</body>

</html>
